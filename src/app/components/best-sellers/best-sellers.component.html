<section class="section-pad bg-soft">
  <div class="container">
    <h2 class="section-title mb-4">الأكثر مبيعاً</h2>

    <div class="wrap">
      <button type="button" class="arrow prev" [class.hide]="!canPrev()" aria-label="السابق" (click)="scroll(1)">
        <i class="bi bi-chevron-right"></i>
      </button>

      <div #row class="row-scroll" (scroll)="update()">
        @for (p of products; track p.id) {
          <div class="item"><app-product-card [product]="p" /></div>
        }
      </div>

      <button type="button" class="arrow next" [class.hide]="!canNext()" aria-label="التالي" (click)="scroll(-1)">
        <i class="bi bi-chevron-left"></i>
      </button>
    </div>
  </div>
</section>
