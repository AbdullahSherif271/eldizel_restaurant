<section id="menu" class="section-pad">
  <div class="container">
    @if (search.active()) {
      <h2 class="section-title mb-3">نتائج البحث عن "{{ search.query() }}"</h2>
    } @else {
      <h2 class="section-title mb-3">المنيو</h2>
    }

    @if (groups().length) {
      <nav class="pills">
        @for (g of groups(); track g.id) {
          <button type="button" (click)="scrollTo(g.id)">{{ g.name }}</button>
        }
      </nav>

      @for (g of groups(); track g.id) {
        <div class="group" [id]="'cat-' + g.id">
          <h3 class="group-title">{{ g.name }}</h3>
          <div class="row g-3 g-md-4">
            @for (p of g.products; track p.id) {
              <div class="col-12 col-sm-6 col-md-4 col-lg-3"><app-product-card [product]="p" [rowOnMobile]="true" /></div>
            }
          </div>
        </div>
      }
    } @else {
      <div class="empty">
        <i class="bi bi-search"></i>
        <p>مفيش نتايج للبحث ده</p>
        <button type="button" class="btn btn-brand" (click)="search.clear()">عرض كل المنيو</button>
      </div>
    }
  </div>
</section>
