<section class="spin">
  <div class="container">
    <div class="row align-items-center g-4">
      <div class="col-md-6 order-md-1 text-center text-md-start">
        <span class="tag">جديد</span>
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <div class="price">{{ product.price }} ج.م</div>
        <button type="button" class="btn btn-dark btn-lg rounded-pill px-5 fw-bold" [disabled]="product.available === false" (click)="cart.add(product); cart.open()">
          @if (product.available === false) { غير متاح حالياً } @else { اطلب الآن <i class="bi bi-arrow-left me-1"></i> }
        </button>
      </div>

      <div class="col-md-6 order-md-2">
        <div class="stage">
          <div class="glow"></div>
          <img class="burger" [src]="product.image" [alt]="product.name">
          <div class="shadow"></div>
        </div>
      </div>
    </div>
  </div>
</section>
