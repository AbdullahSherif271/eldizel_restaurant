<footer class="ft position-relative text-white text-center mt-4">
  <div class="container">
    <!-- 3 أعمدة: اللوجو | الأرقام + العنوان (في النص) | السوشيال -->
    <div class="row g-3 align-items-center">
      <div class="col-12 col-md d-flex justify-content-center justify-content-md-start">
        <img class="ft-logo w-auto" [src]="r.logo" [alt]="r.name">
      </div>

      <div class="col-12 col-md-auto d-flex flex-column align-items-center gap-2">
        <div class="d-flex flex-wrap justify-content-center row-gap-1 column-gap-4 fw-bolder fs-6">
          @for (p of r.phones; track p.number) {
          <span class="d-inline-flex align-items-center gap-2">
            <a class="link-light link-opacity-75-hover text-decoration-none d-inline-flex align-items-center gap-2"
              [href]="'tel:' + p.number" dir="ltr">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16">
                <path
                  d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .643.178l2.19-.547c.52-.13 1.072.014 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.01c-.363-1.03-.038-2.137.702-2.877L1.885.511z" />
              </svg>
              {{ p.number }}
            </a>
            @if (p.whatsapp) {
            <a class="ft-wa d-flex align-items-center justify-content-center text-decoration-none"
              [href]="waLink(p.number)" target="_blank" rel="noopener" aria-label="واتساب">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path
                  d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.853 7.853 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.601 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.558 6.58 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.833-.306-1.589-.973-.585-.521-.98-1.166-1.094-1.363-.114-.197-.012-.304.087-.403.088-.088.197-.232.296-.348.1-.114.133-.197.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.342l-.381-.006c-.133 0-.348.05-.53.248-.183.197-.703.687-.703 1.676 0 .989.71 1.948.808 2.081.098.133 1.394 2.137 3.381 2.992.474.205.843.328 1.132.418.475.152.904.129 1.246.078.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.379-.232z" />
              </svg>
            </a>
            }
          </span>
          }
        </div>
        <p class="ft-address d-inline-flex align-items-center justify-content-center gap-2 m-0 fw-bold small">
          <i class="bi bi-geo-alt-fill fs-6"></i>{{ r.address }}
        </p>
      </div>

      <div class="col-12 col-md d-flex justify-content-center justify-content-md-end gap-2">
        @for (s of r.social; track s.name) {
        <a class="ft-soc d-flex align-items-center justify-content-center rounded-circle bg-white shadow text-decoration-none"
          [href]="s.url" target="_blank" rel="noopener" [attr.aria-label]="s.name"><i [class]="'bi ' + s.icon"></i></a>
        }
      </div>
    </div>
  </div>
</footer>
