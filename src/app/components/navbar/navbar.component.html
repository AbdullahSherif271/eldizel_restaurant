<header class="nb">
  <!-- شريط العروض المتحرك -->
  <div class="nb-promo" aria-hidden="true">
    <div class="nb-track">
      @for (i of [1, 2]; track i) {
      @for (p of promos; track p.text) {
      <span class="nb-item">
        @switch (p.icon) {
        @case ('flame') {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2c.8 3-1 4.6-2.4 6.4C8.2 10.2 7 11.8 7 14.3A5 5 0 0 0 12 19.5a5 5 0 0 0 5-5c0-2.1-1-3.6-2.1-4.7.1 1.6-.4 2.6-1.3 3.2C14.4 9.4 14 5 12 2z" />
        </svg>
        }
        @case ('delivery') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="6" cy="17" r="3" />
          <circle cx="18" cy="17" r="3" />
          <path d="M6 17h5l3-7h3l1 7M9 7h3" />
        </svg>
        }
        @case ('burger') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M4 11a8 6 0 0 1 16 0H4z" />
          <path d="M3 14.5h18" />
          <path d="M4 18h16v1a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1z" />
        </svg>
        }
        @case ('star') {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" />
        </svg>
        }
        }
        {{ p.text }}
      </span>
      }
      }
    </div>
  </div>

  <div class="nb-bar">
    <div class="container nb-inner">
      <a class="nb-brand" href="#" (click)="$event.preventDefault(); home()">
        <img class="nb-logo" [src]="r.logo" [alt]="r.name">
        <span class="nb-name">{{ r.name }}</span>
      </a>

      <form class="nb-search" role="search" (submit)="$event.preventDefault()">
        <i class="bi bi-search"></i>
        <input type="search" #q [placeholder]="placeholder()" autocomplete="off" aria-label="بحث"
          [value]="search.query()" (input)="onInput(q.value)" (keydown.escape)="search.clear()">
        @if (search.active()) {
        <button type="button" class="nb-clear" aria-label="مسح" (click)="search.clear(); q.focus()"><i
            class="bi bi-x-lg"></i></button>
        }
      </form>
    </div>
  </div>
</header>
